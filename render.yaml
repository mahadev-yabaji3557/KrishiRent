services:
  # Backend Web Service
  - type: web
    name: krishirent-api
    env: node
    rootDir: server
    buildCommand: npm install && npx prisma db push && npm run seed && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        value: yabajianand@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        value: KrishiRent & AgroMart <yabajianand@gmail.com>

  # Frontend Static Site
  - type: web
    name: krishirent-web
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html